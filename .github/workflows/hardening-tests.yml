name: Hardening tests

# The security hardening's tests: Buddy's JVM tests with the adb-key isolation test run over Buddy's own proot and
# Alpine, and the helper's tests. In a workflow of its own so upstream's build.yml merges in without conflicts.
on:
  push:
    branches: [security-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true # proot (third_party/), built for the runner by the script

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Helper tests
        run: bash linux/test/run.sh

      - name: Unit tests (Robolectric, proot over Alpine)
        run: .github/scripts/unit-tests.sh

      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
